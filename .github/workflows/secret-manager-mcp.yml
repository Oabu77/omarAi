name: Secret Manager MCP Security Checks

on:
  pull_request:
    paths:
      - 'connectors/secret-manager-mcp/**'
      - '.github/workflows/secret-manager-mcp.yml'
  push:
    branches:
      - main
    paths:
      - 'connectors/secret-manager-mcp/**'
      - '.github/workflows/secret-manager-mcp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: connectors/secret-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connectors/secret-manager-mcp/package.json
      - name: Install production dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Security regression tests
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
