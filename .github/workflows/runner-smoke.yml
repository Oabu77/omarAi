name: Runner Smoke Test

on:
  push:
    paths:
      - app.py
      - config.py
      - live_data.py
      - requirements.txt
      - system_prompt.md
      - .github/workflows/runner-smoke.yml
      - .github/workflows/play-publisher-readiness.yml
      - test_security_error_redaction.py
      - test_security_play_publisher_readiness.py
      - test_security_status_integrity.py
      - test_security_ci_path_coverage.py
  pull_request:
    paths:
      - app.py
      - config.py
      - live_data.py
      - requirements.txt
      - system_prompt.md
      - .github/workflows/runner-smoke.yml
      - .github/workflows/play-publisher-readiness.yml
      - test_security_error_redaction.py
      - test_security_play_publisher_readiness.py
      - test_security_status_integrity.py
      - test_security_ci_path_coverage.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify runner
        run: echo "runner-ready"

      - name: Create isolated test environment
        run: python -m venv .venv

      - name: Install declared runtime dependencies
        run: >-
          .venv/bin/python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: -r requirements.txt

      - name: Verify installed dependency consistency
        run: .venv/bin/python -m pip check

      - name: Run provider error-redaction security regression
        run: .venv/bin/python -m unittest -v test_security_error_redaction.py

      - name: Run Play publisher secret-boundary regression
        run: .venv/bin/python -m unittest -v test_security_play_publisher_readiness.py

      - name: Run operational status-integrity regression
        run: .venv/bin/python -m unittest -v test_security_status_integrity.py

      - name: Run security workflow coverage regression
        run: .venv/bin/python -m unittest -v test_security_ci_path_coverage.py
