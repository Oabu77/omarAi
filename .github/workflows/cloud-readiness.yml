name: Omar AI cloud readiness

on:
  push:
    branches: [codex/omar-ai-cloud]
    paths: [.github/workflows/cloud-readiness.yml, backend/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-access:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check cloud deployment credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          token = bool(os.environ.get('CLOUDFLARE_API_TOKEN') or os.environ.get('CF_API_TOKEN'))
          global_key = bool(os.environ.get('CLOUDFLARE_API_KEY') and os.environ.get('CLOUDFLARE_EMAIL'))
          account = bool(os.environ.get('CLOUDFLARE_ACCOUNT_ID') or os.environ.get('CF_ACCOUNT_ID'))
          result = {'cloudflare_token_configured': token, 'cloudflare_global_key_configured': global_key, 'cloudflare_account_configured': account}
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Omar AI cloud access: ' + json.dumps(result) + '\n')
          if not (token or global_key) or not account:
              raise SystemExit('Cloud deployment is blocked: configure Cloudflare deployment credentials in GitHub Actions secrets. No deployment was attempted.')
          PY

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: cloud-access
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: omar-ai-cloud-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Inspect cloud bindings and configure the production API
        run: node scripts/configure-cloud.mjs
      - name: Bundle before publishing
        run: npx --no-install wrangler deploy --config wrangler.cloud.json --dry-run
      - name: Apply additive cloud database migrations
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.cloud.json
      - name: Deploy the existing Android API origin
        run: npx --no-install wrangler deploy --config wrangler.cloud.json --keep-vars
      - name: Verify the public API and cloud database
        env:
          OMAR_SMOKE_ID_TOKEN: ${{ secrets.OMAR_SMOKE_ID_TOKEN }}
        run: node scripts/verify-cloud.mjs
