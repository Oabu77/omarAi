name: Omar AI cloud readiness

on:
  push:
    branches: [codex/omar-ai-cloud]
    paths: [.github/workflows/cloud-readiness.yml, backend/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-access:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check cloud deployment credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          token = bool(os.environ.get('CLOUDFLARE_API_TOKEN') or os.environ.get('CF_API_TOKEN'))
          account = bool(os.environ.get('CLOUDFLARE_ACCOUNT_ID') or os.environ.get('CF_ACCOUNT_ID'))
          result = {'cloudflare_token_configured': token, 'cloudflare_account_configured': account}
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Omar AI cloud access: ' + json.dumps(result) + '\n')
          if not token or not account:
              raise SystemExit('Cloud deployment is blocked: configure Cloudflare deployment credentials in GitHub Actions secrets. No deployment was attempted.')
          PY
