name: Google Play Publisher Readiness

on:
  push:
    paths:
      - .github/workflows/play-publisher-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-22.04
    steps:
      - name: Check configured publisher credentials without revealing values
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
        shell: bash
        run: |
          set -euo pipefail
          names=(
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
            PLAY_SERVICE_ACCOUNT_JSON
            ANDROID_PUBLISHER_CREDENTIALS
            GOOGLE_SERVICE_ACCOUNT_JSON
            SERVICE_ACCOUNT_JSON
            GOOGLE_PLAY_SERVICE_ACCOUNT
            PLAY_STORE_SERVICE_ACCOUNT_JSON
            GCP_SERVICE_ACCOUNT_KEY
            SUPPLY_JSON_KEY_DATA
          )
          found=false
          printf '{\n  "credentials": {\n' > readiness.json
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            present=false
            if [ -n "${!name:-}" ]; then
              present=true
              found=true
            fi
            comma=','
            if [ "$i" -eq "$((${#names[@]} - 1))" ]; then comma=''; fi
            printf '    "%s": %s%s\n' "$name" "$present" "$comma" >> readiness.json
          done
          printf '  },\n  "publisher_credentials_present": %s\n}\n' "$found" >> readiness.json
          echo "publisher_credentials_present=$found" >> "$GITHUB_STEP_SUMMARY"
          cat readiness.json

      - name: Upload readiness result
        uses: actions/upload-artifact@v4
        with:
          name: google-play-publisher-readiness
          path: readiness.json
          retention-days: 1

