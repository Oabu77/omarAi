name: Google Play Publisher Readiness

on:
  push:
    paths:
      - .github/workflows/play-publisher-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-22.04
    steps:
      - name: Record secret-free publisher readiness state
        shell: bash
        run: |
          set -euo pipefail
          cat > readiness.json <<'JSON'
          {
            "publisher_credentials_present": "not_checked",
            "reason": "Repository workflows must not receive long-lived Google Play publisher credentials."
          }
          JSON
          {
            echo "publisher_credentials_present=not_checked"
            echo "Credential presence is intentionally not inspected from repository secrets."
            echo "Use a protected deployment environment or short-lived workload identity for any future publisher action."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-play-publisher-readiness
          path: readiness.json
          retention-days: 1

# This workflow is intentionally provider-free and secret-free.
# Long-lived publisher credentials must not be exposed to branch-push workflow code.
